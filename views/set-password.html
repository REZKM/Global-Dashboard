<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your password</title>
<!-- design-tokens -->
<style>{{authStyles}}</style>
</head>
<body>
  <div class="card">
    <p class="brand">Global Dashboards Center</p>
    <h1>Welcome! Create a password</h1>
    <p class="sub">This is your first time signing in as <strong>{{email}}</strong></p>
    {{error}}
    <form method="POST" action="/set-password">
      <input type="hidden" name="email" value="{{email}}" />
      <label for="password">New password</label>
      <input type="password" id="password" name="password" minlength="8" required autofocus />
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required />
      <button type="submit">Create password &amp; sign in</button>
    </form>
    <a class="back" href="/login">Wrong email? Go back</a>
  </div>
</body>
</html>
